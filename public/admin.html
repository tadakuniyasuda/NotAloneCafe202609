<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not Alone Cafe — Admin</title>
<style>
  :root {
    --cream: #FBF7F0;
    --sky-deep: #5B9BC4;
    --ink: #2B2B2B;
    --coral: #E8746B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--ink);
    padding: 20px;
  }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  .sub { font-size: 0.8rem; color: #888; margin-bottom: 20px; }
  h2.section { font-size: 0.9rem; margin: 26px 0 10px; color: #555; }

  .card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 8px;
  }
  .card .current-label { font-size: 0.7rem; color: #b08a5a; font-weight: 600; letter-spacing: 0.05em; }
  .card .current-q { font-size: 1.05rem; margin: 6px 0 14px; min-height: 1.4em; }
  .card .current-q.empty { color: #bbb; font-style: italic; }
  .card .current-cat { font-size: 0.78rem; color: #8a8a8a; margin: -8px 0 12px; min-height: 1em; }
  #toast { display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 250;
    background: #c0392b; color: white; padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; box-shadow: 0 4px 14px rgba(0,0,0,.25); max-width: 90vw; }

  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .controls label { font-size: 0.85rem; }
  select, button, input[type=text], input[type=time] {
    font-size: 0.85rem;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: white;
  }
  button.primary { background: var(--sky-deep); color: white; border: none; cursor: pointer; }
  button.danger { color: var(--coral); border-color: var(--coral); cursor: pointer; background: white; }
  button.ghost { cursor: pointer; }
  input[type=text] { flex: 1; min-width: 180px; }

  .schedule-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .schedule-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
  .schedule-item .fired { color: #aaa; text-decoration: line-through; }
  .schedule-item button { padding: 2px 8px; font-size: 0.75rem; }

  .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.85rem; }

  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .group-card { background: white; border-radius: 14px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .group-card h3 { margin: 0 0 6px; font-size: 0.95rem; }
  .group-card .count { font-size: 1.4rem; font-weight: 700; }
  .group-card .cap { font-size: 0.75rem; color: #999; }

  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; font-size: 0.85rem; border-bottom: 1px solid #f0f0f0; }
  th { background: #f5f1ea; font-weight: 600; }
  select.move-select { padding: 4px 6px; }

  .status { margin-top: 16px; font-size: 0.75rem; color: #b5b5b5; }

  #connOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43,43,43,0.94);
    color: white;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    z-index: 200;
    padding: 20px;
  }
  #connOverlay .icon { font-size: 2.4rem; }
  #connOverlay .msg { font-size: 1rem; line-height: 1.6; max-width: 320px; }
  #connOverlay button {
    margin-top: 6px;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: white;
    color: var(--ink);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div id="toast">未接続のため操作できませんでした。つながってからもう一度押してください。</div>
  <div id="connOverlay">
    <div class="icon">📡</div>
    <div class="msg">管理画面の接続が切れました。<br>自動で再接続しています…</div>
    <button onclick="location.reload()">今すぐ再読み込み</button>
  </div>

  <h1>Not Alone Cafe — 管理画面</h1>
  <div class="sub">グループとディスカッションのスケジュールを管理します</div>

  <h2 class="section">ディスカッションテーマ</h2>
  <div class="card">
    <div class="current-label">現在表示中のテーマ</div>
    <div class="current-q empty" id="currentQDisplay">（まだ設定されていません）</div>
    <div class="current-cat" id="currentCatDisplay"></div>
    <div class="controls">
      <label for="categorySelect">カテゴリ:</label>
      <select id="categorySelect"></select>
    </div>
    <div class="controls">
      <select id="questionPreset"></select>
      <button class="primary ghost" id="setPresetBtn">このテーマにする</button>
    </div>
    <div class="controls">
      <button class="primary" id="randomTopicBtn">🎲 このカテゴリからランダムに選ぶ</button>
    </div>
    <div class="info-sub" style="font-size:0.75rem; color:#999; margin:-2px 0 12px;">
      ✓ は今回すでに使ったテーマです。ランダムは未使用のテーマを優先します。
    </div>
    <div class="controls">
      <input type="text" id="customQuestion" placeholder="オリジナルのテーマを入力…" />
      <button class="primary ghost" id="setCustomBtn">設定する</button>
      <button class="danger" id="clearQBtn">クリア</button>
    </div>
  </div>

  <h2 class="section">イベント終了</h2>
  <div class="card">
    <div class="current-label">状態</div>
    <div class="current-q" id="eventOverStatus">通常運転中</div>
    <div class="controls">
      <button class="danger" id="eventOverBtn">イベント終了にする</button>
    </div>
    <div class="info-sub" style="font-size:0.78rem; color:#999; margin-top:6px;">
      参加者の画面が終了メッセージに切り替わります。テストしたい場合は「クリア」ボタンで元に戻せます。
    </div>
  </div>

  <h2 class="section">自動シャッフル・スケジュール</h2>
  <div class="card">
    <div class="toggle-row">
      <input type="checkbox" id="autoToggle" checked />
      <label for="autoToggle">自動シャッフルを有効にする</label>
    </div>
    <div class="schedule-list" id="scheduleList"></div>
    <div class="controls">
      <input type="time" id="newTimeInput" />
      <button class="ghost" id="addTimeBtn">時刻を追加</button>
      <button class="danger" id="clearScheduleBtn">全て削除</button>
    </div>
    <div class="controls">
      <label for="autoCategorySelect">自動／今すぐシャッフルで使うカテゴリ:</label>
      <select id="autoCategorySelect"><option value="all">すべてのカテゴリからランダム</option></select>
    </div>
    <div class="controls">
      <button class="primary" id="shuffleNowBtn">🔀 今すぐ全員シャッフル</button>
    </div>
  </div>

  <h2 class="section">グループ設定</h2>
  <div class="controls">
    <label for="numGroupsSelect">チーム数:</label>
    <select id="numGroupsSelect">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
    </select>
    <button class="danger" id="resetBtn">全員リセット</button>
  </div>

  <div class="groups" id="groupCards"></div>

  <table>
    <thead><tr><th>タグ</th><th>気分</th><th>チーム</th><th>移動</th></tr></thead>
    <tbody id="roster"></tbody>
  </table>

  <div class="status" id="status">接続中…</div>
  <audio id="notifSound" src="/sound/notification.mp3" preload="auto"></audio>

<script src="/conn.js"></script>
<script src="/debug.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const key = params.get("key") || "";
  const statusEl = document.getElementById("status");
  const groupCardsEl = document.getElementById("groupCards");
  const rosterEl = document.getElementById("roster");
  const numGroupsSelect = document.getElementById("numGroupsSelect");
  const notifSound = document.getElementById("notifSound");
  const categorySelect = document.getElementById("categorySelect");
  const presetSelect = document.getElementById("questionPreset");
  const autoCategorySelect = document.getElementById("autoCategorySelect");

  // Unlock audio on the first click anywhere in the admin UI (browsers require
  // one real interaction before JS can play sound).
  document.addEventListener("click", function unlockAudio() {
    notifSound.play().then(() => { notifSound.pause(); notifSound.currentTime = 0; }).catch(() => {});
    document.removeEventListener("click", unlockAudio);
  }, { once: true });

  let previousQuestion = null;
  let adminInitiatedChange = false; // true right after the admin themself triggers a question/shuffle change
  let currentSchedule = [];
  let categories = [];      // from the server: [{id, name, topics}]
  let usedTopics = [];
  let topicsKey = "";       // detects when the dropdowns need rebuilding
  let shownQuestion = "";

  // ---- connection (shared layer) ----
  NAC.start({
    role: "admin",
    path: `/?admin=1&key=${encodeURIComponent(key)}`,
    onOpen: () => { statusEl.textContent = "接続済み"; },
    onMessage: (msg) => {
      if (msg.type === "error") { statusEl.textContent = msg.message; return; }
      if (msg.type === "adminState") render(msg);
    },
  });
  NAC.on("close", () => { statusEl.textContent = "接続が切れました（自動で再接続します）"; });
  NAC.getClientView = () => ({ question: shownQuestion });
  NAC.initDebug("admin");

  // A button press while disconnected used to vanish silently. Now it says so.
  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  NAC.on("sendfail", () => {
    toastEl.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, 3500);
  });
  function sendMsg(obj) { return NAC.send(obj); }

  // ---- topic dropdowns ----
  function buildCategoryOptions() {
    const keep = categorySelect.value || "all";
    categorySelect.innerHTML = "";
    const all = document.createElement("option");
    all.value = "all";
    all.textContent = "すべてのカテゴリ";
    categorySelect.appendChild(all);
    categories.forEach((c) => {
      const o = document.createElement("option");
      o.value = c.id;
      o.textContent = `${c.name}（${c.topics.length}）`;
      categorySelect.appendChild(o);
    });
    categorySelect.value = [...categorySelect.options].some((o) => o.value === keep) ? keep : "all";

    // Same list (without counts) for the auto-shuffle category.
    autoCategorySelect.innerHTML = "";
    const all2 = document.createElement("option");
    all2.value = "all";
    all2.textContent = "すべてのカテゴリからランダム";
    autoCategorySelect.appendChild(all2);
    categories.forEach((c) => {
      const o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.name;
      autoCategorySelect.appendChild(o);
    });
  }

  function buildTopicOptions() {
    const keep = presetSelect.value;
    presetSelect.innerHTML = "";
    const sel = categorySelect.value;
    const list = sel === "all" ? categories : categories.filter((c) => c.id === sel);
    list.forEach((c) => {
      const parent = sel === "all" ? document.createElement("optgroup") : presetSelect;
      if (sel === "all") parent.label = c.name;
      c.topics.forEach((t) => {
        const o = document.createElement("option");
        o.value = t;
        o.textContent = (usedTopics.includes(t) ? "✓ " : "") + t;
        parent.appendChild(o);
      });
      if (sel === "all") presetSelect.appendChild(parent);
    });
    if ([...presetSelect.options].some((o) => o.value === keep)) presetSelect.value = keep;
  }

  function syncTopicControls(state) {
    const key2 = JSON.stringify([state.topicCategories.map((c) => c.id + c.topics.length), state.usedTopics]);
    categories = state.topicCategories;
    usedTopics = state.usedTopics || [];
    if (key2 !== topicsKey) {
      const firstTime = topicsKey === "";
      topicsKey = key2;
      if (firstTime) buildCategoryOptions();
      buildTopicOptions();
    }
    // Don't yank a dropdown out from under the admin while it is open.
    if (document.activeElement !== autoCategorySelect) autoCategorySelect.value = state.autoCategory || "all";
  }

  categorySelect.addEventListener("change", buildTopicOptions);
  autoCategorySelect.addEventListener("change", () => sendMsg({ type: "setAutoCategory", value: autoCategorySelect.value }));

  document.getElementById("setPresetBtn").addEventListener("click", () => {
    const v = presetSelect.value;
    if (v) { adminInitiatedChange = true; sendMsg({ type: "setQuestion", text: v }); }
  });
  document.getElementById("randomTopicBtn").addEventListener("click", () => {
    adminInitiatedChange = true;
    sendMsg({ type: "randomTopic", category: categorySelect.value || "all" });
  });
  document.getElementById("setCustomBtn").addEventListener("click", () => {
    const input = document.getElementById("customQuestion");
    if (input.value.trim()) {
      adminInitiatedChange = true;
      sendMsg({ type: "setQuestion", text: input.value.trim() });
      input.value = "";
    }
  });
  document.getElementById("clearQBtn").addEventListener("click", () => { adminInitiatedChange = true; sendMsg({ type: "setQuestion", text: "" }); });
  document.getElementById("eventOverBtn").addEventListener("click", () => {
    if (confirm("参加者の画面を「イベント終了」メッセージに切り替えます。よろしいですか？")) {
      sendMsg({ type: "setEventOver", value: true });
    }
  });
  document.getElementById("shuffleNowBtn").addEventListener("click", () => { adminInitiatedChange = true; sendMsg({ type: "shuffleNow" }); });
  document.getElementById("autoToggle").addEventListener("change", (e) => sendMsg({ type: "toggleAuto", enabled: e.target.checked }));

  document.getElementById("addTimeBtn").addEventListener("click", () => {
    const val = document.getElementById("newTimeInput").value; // "HH:MM"
    if (!val) return;
    const items = [...currentSchedule.map((s) => ({ time: s.time })), { time: val }];
    sendMsg({ type: "setSchedule", items });
    document.getElementById("newTimeInput").value = "";
  });

  document.getElementById("clearScheduleBtn").addEventListener("click", () => {
    if (confirm("スケジュールを全て削除しますか？")) sendMsg({ type: "setSchedule", items: [] });
  });

  numGroupsSelect.addEventListener("change", () => {
    sendMsg({ type: "setNumGroups", value: parseInt(numGroupsSelect.value, 10) });
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("全員の参加状態とテーマ・履歴をリセットしますか？")) sendMsg({ type: "reset" });
  });

  const ALL_TEAMS = ["A", "B", "C", "D"];
  const VIBE_LABELS = { yellow: "イェロー", pink: "ピンク", green: "グリーン", blue: "ブルー" };

  function render(state) {
    // Alert only when the question changed WITHOUT the admin themselves
    // causing it — meaning the schedule fired automatically.
    if (previousQuestion !== null && state.question !== previousQuestion && state.question) {
      if (!adminInitiatedChange) {
        notifSound.currentTime = 0;
        notifSound.play().catch(() => {});
      }
    }
    adminInitiatedChange = false;
    previousQuestion = state.question;
    shownQuestion = state.question || "";

    syncTopicControls(state);
    numGroupsSelect.value = state.numTeams;
    currentSchedule = state.schedule || [];

    const qDisplay = document.getElementById("currentQDisplay");
    if (state.question && state.question.length > 0) {
      qDisplay.textContent = state.question;
      qDisplay.classList.remove("empty");
    } else {
      qDisplay.textContent = "（まだ設定されていません）";
      qDisplay.classList.add("empty");
    }
    document.getElementById("currentCatDisplay").textContent = state.category ? `カテゴリ: ${state.category}` : (state.question ? "カテゴリ: オリジナル" : "");

    document.getElementById("autoToggle").checked = !!state.autoEnabled;

    const eventOverStatus = document.getElementById("eventOverStatus");
    const eventOverBtn = document.getElementById("eventOverBtn");
    if (state.eventOver) {
      eventOverStatus.textContent = "イベント終了メッセージを表示中";
      eventOverStatus.classList.remove("empty");
      eventOverBtn.disabled = true;
      eventOverBtn.textContent = "終了メッセージ表示中（クリアで戻せます）";
    } else {
      eventOverStatus.textContent = "通常運転中";
      eventOverStatus.classList.add("empty");
      eventOverBtn.disabled = false;
      eventOverBtn.textContent = "イベント終了にする";
    }

    const listEl = document.getElementById("scheduleList");
    listEl.innerHTML = "";
    currentSchedule.forEach((item) => {
      const row = document.createElement("div");
      row.className = "schedule-item";
      row.innerHTML = `
        <span class="${item.fired ? "fired" : ""}">${item.time}${item.fired ? "（実施済み）" : ""}</span>
        <button data-id="${item.id}">削除</button>
      `;
      row.querySelector("button").addEventListener("click", () => {
        const items = currentSchedule.filter((s) => s.id !== item.id).map((s) => ({ time: s.time }));
        sendMsg({ type: "setSchedule", items });
      });
      listEl.appendChild(row);
    });

    groupCardsEl.innerHTML = "";
    for (const [k, t] of Object.entries(state.teams)) {
      if (!t.active) continue;
      const card = document.createElement("div");
      card.className = "group-card";
      card.innerHTML = `<h3>${t.label}</h3><div class="count">${t.count}</div><div class="cap">目安: ${t.capacity} 人まで</div>`;
      groupCardsEl.appendChild(card);
    }

    rosterEl.innerHTML = "";
    for (const person of state.roster) {
      const tr = document.createElement("tr");
      const options = ALL_TEAMS.map(
        (t) => `<option value="${t}" ${t === person.group ? "selected" : ""}>${t}</option>`
      ).join("");
      tr.innerHTML = `
        <td>${person.tag}</td>
        <td>${VIBE_LABELS[person.vibe] || "-"}</td>
        <td>${person.group || "-"}</td>
        <td><select class="move-select" data-token="${person.token}">${options}</select></td>
      `;
      rosterEl.appendChild(tr);
    }

    rosterEl.querySelectorAll(".move-select").forEach((sel) => {
      sel.addEventListener("change", () => {
        sendMsg({ type: "move", token: sel.dataset.token, toGroup: sel.value });
      });
    });
  }
</script>
</body>
</html>
